<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search | THE FURNITURE STORE</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/bootstrap.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png">
    <script src="assets/js/header.js"></script>
</head>
<body>
<header class="header axil-header header-style-1" id="page-header">
    <header-content></header-content>
</header>

<main class="search-page">
    <section class="search-controls container">
        <div class="search-panel">
            <div class="search-bar-row">
                <label class="visually-hidden" for="search-keyword">Search products</label>
                <svg class="search-bar-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M20 20l-4.2-4.2"></path>
                </svg>
                <input type="search" id="search-keyword" placeholder="Search furniture, room pieces, materials..." autocomplete="off">
                <button type="button" class="search-filter-toggle-btn" id="search-filter-toggle" onclick="toggleFilterPanel();" aria-expanded="false" aria-controls="search-filter-row">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 6h16"></path>
                        <path d="M7 12h10"></path>
                        <path d="M10 18h4"></path>
                    </svg>
                    <span>Filters</span>
                    <span class="search-filter-count" id="search-filter-count" hidden>0</span>
                </button>
                <button type="button" class="search-submit-btn" onclick="searchProducts();">Search</button>
            </div>

            <div class="search-filter-row " id="search-filter-row">
                <div class="search-filter-field search-filter-field--sort">
                    <label for="search-sort">Sort by</label>
                    <select id="search-sort" onchange="searchProducts();">
                        <option value="recent">Recently added</option>
                        <option value="price-asc">Price low to high</option>
                        <option value="price-desc">Price high to low</option>
                    </select>
                </div>

                <div class="search-filter-field search-filter-field--categories">
                    <label>Categories</label>
                    <div class="category-pill-group" id="search-category" data-selected-value=""></div>
                </div>

                <div class="search-filter-group search-filter-group--price">
                    <div class="search-filter-field">
                        <label for="search-min-price">Min price</label>
                        <input type="number" id="search-min-price" min="0" placeholder="0" onchange="searchProducts();">
                    </div>
                    <div class="search-filter-field">
                        <label for="search-max-price">Max price</label>
                        <input type="number" id="search-max-price" min="0" placeholder="Any" onchange="searchProducts();">
                    </div>
                </div>

                <div class="search-filter-group search-filter-group--actions">
                    <label class="search-toggle-label" for="search-in-stock">
                        <span class="search-toggle-switch">
                            <input type="checkbox" id="search-in-stock" onchange="searchProducts();">
                            <span class="search-toggle-track"><span class="search-toggle-thumb"></span></span>
                        </span>
                        <span>In stock only</span>
                    </label>
                    <button type="button" class="search-reset-btn" onclick="resetSearchFilters();">Reset</button>
                </div>
            </div>
        </div>
    </section>

    <section class="container search-results-section">
        <div class="search-results-heading">
            <h1>Product Results</h1>
            <span id="search-result-count">0 products</span>
        </div>
        <div class="products search-products" id="search-products"></div>
        <div class="d-flex gap-2 justify-content-center mt-4" id="search-pagination"></div>
    </section>
</main>

<footer class="footer">
    <footer-content></footer-content>
</footer>

<script src="assets/js/footer.js"></script>

<script src="assets/js/notification.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/search.js"></script>

<script src="assets/js/vendor/modernizr.min.js"></script>
<script src="assets/js/vendor/jquery.js"></script>
<script src="assets/js/vendor/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
