<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search | THE FURNITURE STORE</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/bootstrap.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png">
    <script src="assets/js/header.js"></script>
</head>
<body>
<header class="header axil-header header-style-1" id="page-header">
    <header-content></header-content>
</header>

<main class="search-page">
    <section class="search-controls container">
        <div class="search-bar-row">
            <label class="visually-hidden" for="search-keyword">Search products</label>
            <input type="search" id="search-keyword" placeholder="Search furniture, room pieces, materials..." autocomplete="off">
            <button type="button" class="search-submit-btn" onclick="searchProducts();">Search</button>
        </div>
        <div class="search-filter-row">
            <div class="search-filter-field">
                <label for="search-sort">Filter</label>
                <select id="search-sort" onchange="searchProducts();">
                    <option value="recent">Recently added</option>
                    <option value="price-asc">Price low to high</option>
                    <option value="price-desc">Price high to low</option>
                </select>
            </div>
            <div class="search-filter-field">
                <label for="search-category">Category</label>
                <select id="search-category" onchange="searchProducts();">
                    <option value="0">All categories</option>
                </select>
            </div>
        </div>
    </section>

    <section class="container search-results-section">
        <div class="search-results-heading">
            <h1>Product Results</h1>
            <span id="search-result-count">0 products</span>
        </div>
        <div class="products search-products" id="search-products"></div>
    </section>
</main>

<script src="assets/js/notification.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadCategories();
        loadAllProducts();

        document.getElementById('search-keyword').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                searchProducts();
            }
        });
    });

    async function loadCategories() {
        try {
            const response = await fetch('api/products/categories');
            const data = await response.json();
            const categorySelect = document.getElementById('search-category');

            if (!data.status || !data.data) {
                return;
            }

            data.data.forEach(category => {
                const option = document.createElement('option');
                option.value = category.id;
                option.textContent = category.name;
                categorySelect.appendChild(option);
            });
        } catch (e) {
            showSearchMessage('Failed to load categories.', false);
        }
    }

    async function loadAllProducts() {
        const productContainer = document.getElementById('search-products');
        productContainer.innerHTML = '<div class="search-status">Loading products...</div>';

        try {
            const response = await fetch('api/advanced-search/all-data');
            const data = await response.json();
            renderProducts(data);
        } catch (e) {
            productContainer.innerHTML = '<div class="search-status">Server error. Please try again.</div>';
        }
    }

    async function searchProducts() {
        const productContainer = document.getElementById('search-products');
        productContainer.innerHTML = '<div class="search-status">Searching products...</div>';

        const payload = {
            keyword: document.getElementById('search-keyword').value,
            sort: document.getElementById('search-sort').value,
            categoryId: Number(document.getElementById('search-category').value)
        };

        try {
            const response = await fetch('api/advanced-search/search-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            renderProducts(data);
        } catch (e) {
            productContainer.innerHTML = '<div class="search-status">Search failed. Please try again.</div>';
        }
    }

    function renderProducts(data) {
        const productContainer = document.getElementById('search-products');
        const resultCount = document.getElementById('search-result-count');

        if (!data.status) {
            productContainer.innerHTML = '<div class="search-status">' + (data.message || 'Failed to load products.') + '</div>';
            resultCount.textContent = '0 products';
            return;
        }

        const products = data.data || [];
        resultCount.textContent = products.length + (products.length === 1 ? ' product' : ' products');

        if (products.length === 0) {
            productContainer.innerHTML = '<div class="search-status">No products found.</div>';
            return;
        }

        productContainer.innerHTML = '';
        products.forEach(product => productContainer.appendChild(createSearchProductCard(product)));
    }

    function createSearchProductCard(product) {
        const card = document.createElement('div');
        card.className = 'product-card search-product-card';
        card.onclick = function() {
            window.location.href = 'single-product-view.html?id=' + product.productId;
        };

        card.innerHTML =
            '<img src="' + product.image + '" alt="' + escapeHtml(product.title) + '">' +
            '<span class="search-product-category">' + escapeHtml(product.categoryName || 'Furniture') + '</span>' +
            '<h4>' + escapeHtml(product.title) + '</h4>' +
            '<p class="price">$' + Number(product.price).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</p>';
        return card;
    }

    function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, function(character) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[character];
        });
    }

    function showSearchMessage(message, status) {
        if (window.Notiflix) {
            status ? Notiflix.Notify.success(message) : Notiflix.Notify.failure(message);
        }
    }
</script>

<script src="assets/js/vendor/modernizr.min.js"></script>
<script src="assets/js/vendor/jquery.js"></script>
<script src="assets/js/vendor/popper.min.js"></script>
<script src="assets/js/vendor/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
