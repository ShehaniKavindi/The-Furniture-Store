<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | THE FURNITURE STORE</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="../../../../InvoicingSystem/src/main/webapp/css/bootstrap.css">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png">
</head>
<body>
    <div class="login-page row row-cols-2" style="width: 100%; height: 100vh;">
        <div class="login-container col" >
            <div class="brand-label">
                <div class="label-outer col-1">
                    <div class="label-inner col-2">
                        
                    </div>
                </div>
                <div>
                    <h2 class="brand-text">THE FURNITURE STORE</h2>
                </div>
            </div>
            <div class="login-box ms-4 mt-4">
                <div class="login-header">
                    <h1>LOGIN</h1>
                </div>
                <p class="text-danger" id="message"></p>
                <fieldset>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" value=""/>
                    </div>
                    <div class="field">
                        <label for="password">password</label>
                        <input type="password" id="password" value="">
                    </div>
                    <div class="row row-cols-2" style="margin-bottom: 5rem;">
                        <div class="col-6" style="margin-top: 2rem;">
                            <input type="checkbox" name="" id="rememberme">
                            <label for="rememberme">Remember Me</label>
                        </div>
                        <div class="col-6" style="margin-top: 2rem;">
                            <a href="" style="text-decoration: none; margin-left: 4rem; color: #6f6550;">Forgot Password ?</a>
                        </div>
                    </div>
                   
                    <div class="buttons">
                        <button  class="login-btn" onclick="login();">LOGIN</button>
                        <button class="register-btn">REGISTER</button>
                    </div>
                </fieldset>
            </div>
        </div>
        
        <div class="login-banner col">
            
        </div>
    </div>

    <!--    Main JS-->
    <script src="assets/js/login.js"></script>

    <script src="assets/js/notification.js"></script>
    <script src="assets/js/notiflix-aio-3.2.8.min.js"></script>

    <!-- Modernizer JS -->
    <script src="assets/js/vendor/modernizr.min.js"></script>
    <!-- jQuery JS -->
    <script src="assets/js/vendor/jquery.js"></script>
    <!-- Bootstrap JS -->
    <script src="assets/js/vendor/popper.min.js"></script>
    <script src="assets/js/vendor/bootstrap.min.js"></script>
    <script src="assets/js/vendor/slick.min.js"></script>
    <script src="assets/js/vendor/js.cookie.js"></script>
    <script src="assets/js/vendor/jquery-ui.min.js"></script>
    <script src="assets/js/vendor/jquery.ui.touch-punch.min.js"></script>
    <script src="assets/js/vendor/jquery.countdown.min.js"></script>
    <script src="assets/js/vendor/sal.js"></script>
    <script src="assets/js/vendor/jquery.magnific-popup.min.js"></script>
    <script src="assets/js/vendor/imagesloaded.pkgd.min.js"></script>
    <script src="assets/js/vendor/isotope.pkgd.min.js"></script>
    <script src="assets/js/vendor/counterup.js"></script>
    <script src="assets/js/vendor/waypoints.min.js"></script>
</body>
</html>
