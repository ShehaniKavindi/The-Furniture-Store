<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | THE FURNITURE STORE</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/bootstrap.css">
    <script src="assets/js/header.js"></script></head>
<body>

<header class="header axil-header header-style-1">
    <header-content></header-content>
</header>

<main class="wishlist-page">
    <section class="container wishlist-page-heading">
        <div>
            <p class="label">MY WISHLIST</p>
            <h1>My Wishlist</h1>
        </div>
        <a href="shop.html" class="wishlist-continue-link">Continue Shopping</a>
    </section>

    <section class="container">
        <div class="products search-products wishlist-table" id="wishlist-products"></div>
    </section>
</main>

<footer class="footer">
    <footer-content></footer-content>
</footer>

<script src="assets/js/footer.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script>
    async function loadWishlist(){
        const container=document.getElementById('wishlist-products');
        container.textContent='Loading wishlist...';
        try{const response=await fetch('api/wishlist');
            const data=await response.json();
            if(!data.status){container.textContent=data.message;return;}
            if(!data.data.length){
                container.textContent='Your wishlist is empty.';
                return;
            }
            container.innerHTML='';data.data.forEach(product=>{
                const card=document.createElement('div');
                card.className='product-card search-product-card';
                card.innerHTML='' +
                    '<button type="button" class="btn btn-outline-dark" aria-label="Remove from wishlist">&times;</button>' +
                    '<img src="'+product.image+'" alt="">' +
                    '<div class="wishlist-item-info">' +
                    '<span class="search-product-category">'+product.categoryName+'</span>' +
                    '<h4>'+product.title+'</h4>' +
                    '</div>' +
                    '<p class="price">$'+Number(product.price).toFixed(2)+'</p>';
                card.onclick=event=>{if(event.target.tagName==='BUTTON')
                    return;
                    location.href='single-product-view.html?id='+product.productId;};
                card.querySelector('button').onclick=()=>removeProduct(product.productId);
                container.appendChild(card);});
        }catch(e){
            container.textContent='Unable to load wishlist.';}
    }
    async function removeProduct(productId){
        const response=await fetch('api/wishlist/'+productId,{method:'DELETE'});
        const data=await response.json();
        if(data.status)loadWishlist();
        else Notiflix.Notify.failure(data.message);
    }
    document.addEventListener('DOMContentLoaded',loadWishlist);
</script>
</body>
</html>
