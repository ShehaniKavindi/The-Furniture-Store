<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | THE FURNITURE STORE</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/bootstrap.css">
</head>
<body>
<main class="login-page row" style="width: 100%; min-height: 100vh;">
    <section class="login-container col-md-6">
        <div class="login-box ms-4 mt-4">
            <div class="login-header"><h1>RESET PASSWORD</h1></div>
            <p>Enter the code sent to your email and choose a new password.</p>
            <div class="field"><label for="email">Email</label><input type="email" id="email"></div>
            <div class="field"><label for="code">Reset code</label><input type="text" id="code" maxlength="6" inputmode="numeric"></div>
            <div class="field"><label for="password">New password</label><input type="password" id="password"></div>
            <div class="buttons"><button class="login-btn" type="button" onclick="resetPassword()">RESET PASSWORD</button></div>
            <p><a href="login.html">Return to login</a></p>
        </div>
    </section>
</main>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/reset-password.js"></script>
</body>
</html>
