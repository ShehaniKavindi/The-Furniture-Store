<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | THE FURNITURE STORE</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/bootstrap.css">
</head>
<body>
<main class="login-page row" style="width: 100%; min-height: 100vh;">
    <section class="login-container col-md-6" style="margin: 0 auto;">
        <div class="login-box">
            <div class="login-header"><h1>Reset Password</h1></div>
            <p class="login-subtitle">Enter the code sent to your email and choose a new password.</p>

            <div class="field">
                <label for="email" class="visually-hidden">Email</label>
                <div class="input-with-icon">
                    <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                        <path d="M3 7l9 6 9-6"></path>
                    </svg>
                    <input type="email" id="email" placeholder="Email Address">
                </div>
            </div>

            <div class="field">
                <label for="code" class="visually-hidden">Reset code</label>
                <div class="input-with-icon">
                    <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="8" width="18" height="12" rx="2"></rect>
                        <path d="M7 8V6a5 5 0 0 1 10 0v2"></path>
                        <circle cx="12" cy="14" r="1.5"></circle>
                    </svg>
                    <input type="text" id="code" maxlength="6" inputmode="numeric" placeholder="6-digit code">
                </div>
            </div>

            <div class="field">
                <label for="password" class="visually-hidden">New password</label>
                <div class="input-with-icon">
                    <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                    </svg>
                    <input type="password" id="password" placeholder="New password">
                </div>
            </div>

            <div class="buttons">
                <button class="login-btn" type="button" onclick="resetPassword()">Reset Password</button>
            </div>

            <p class="register-prompt"><a href="login.html">Return to login</a></p>
        </div>
    </section>
</main>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/reset-password.js"></script>
</body>
</html>
