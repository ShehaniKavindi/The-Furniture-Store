<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE FURNITURE STORE</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/bootstrap.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png">

    <script src="assets/js/header.js"></script>

</head>

<body>
<header class="header axil-header header-style-1" id="page-header">
    <header-content></header-content>
</header>

<section class="w-100 shop-content" id="shop-content">
</section>

<!--    Main JS-->
<script src="assets/js/.js"></script>

<script src="assets/js/notification.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadShopCategories();
    });

    async function loadShopCategories() {
        const shopContent = document.getElementById('shop-content');
        shopContent.innerHTML = '<div class="products container">Loading products...</div>';

        try {
            const response = await fetch('api/products/categories');
            const data = await response.json();

            if (!data.status) {
                shopContent.innerHTML = '<div class="products container">Failed to load categories.</div>';
                return;
            }

            shopContent.innerHTML = '';
            for (const category of data.data) {
                const categoryBox = document.createElement('div');
                categoryBox.className = 'category-box';
                categoryBox.innerHTML =
                    '<div class="category-name mt-3">' +
                    '<p>~ ' + category.name + ' ~</p>' +
                    '<a href="category-view.html?categoryId=' + category.id + '&categoryName=' + encodeURIComponent(category.name) + '" type="button">view more <i class="bi bi-arrow-right-circle" style="font-size: 1.5rem;"></i></a>' +
                    '</div>' +
                    '<div class="products container" id="category-products-' + category.id + '"></div>';
                shopContent.appendChild(categoryBox);

                loadCategoryPreview(category.id);
            }
        } catch (e) {
            shopContent.innerHTML = '<div class="products container">Server error. Please try again.</div>';
        }
    }

    async function loadCategoryPreview(categoryId) {
        const productContainer = document.getElementById('category-products-' + categoryId);
        productContainer.innerHTML = 'Loading products...';

        try {
            const response = await fetch('api/products/categories/' + categoryId + '/products?limit=3');
            const data = await response.json();

            if (!data.status || !data.data || data.data.length === 0) {
                productContainer.innerHTML = '<div>No products found.</div>';
                return;
            }

            productContainer.innerHTML = '';
            data.data.forEach(product => productContainer.appendChild(createProductCard(product)));
        } catch (e) {
            productContainer.innerHTML = '<div>Failed to load products.</div>';
        }
    }

    function createProductCard(product) {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.onclick = function() {
            window.location.href = 'single-product-view.html?id=' + product.id;
        };
        const imagePath = product.imagePaths && product.imagePaths.length > 0
            ? product.imagePaths[0]
            : 'assets/images/product-01.jpg';
        card.innerHTML =
            '<img src="' + imagePath + '" alt="">' +
            '<h4>' + product.title + '</h4>' +
            '<p class="price">$' + Number(product.price).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</p>';
        return card;
    }
</script>

<!-- Modernizer JS -->
<script src="assets/js/vendor/modernizr.min.js"></script>
<!-- jQuery JS -->
<script src="assets/js/vendor/jquery.js"></script>
<!-- Bootstrap JS -->
<script src="assets/js/vendor/popper.min.js"></script>
<script src="assets/js/vendor/bootstrap.min.js"></script>
<script src="assets/js/vendor/slick.min.js"></script>
<script src="assets/js/vendor/js.cookie.js"></script>
<script src="assets/js/vendor/jquery-ui.min.js"></script>
<script src="assets/js/vendor/jquery.ui.touch-punch.min.js"></script>
<script src="assets/js/vendor/jquery.countdown.min.js"></script>
<script src="assets/js/vendor/sal.js"></script>
<script src="assets/js/vendor/jquery.magnific-popup.min.js"></script>
<script src="assets/js/vendor/imagesloaded.pkgd.min.js"></script>
<script src="assets/js/vendor/isotope.pkgd.min.js"></script>
<script src="assets/js/vendor/counterup.js"></script>
<script src="assets/js/vendor/waypoints.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
