<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE FURNITURE STORE</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/bootstrap.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png">

    <script src="assets/js/header.js"></script>
</head>
<body>
<header class="header axil-header header-style-1" id="page-header">
    <header-content></header-content>
</header>

<section class="category-view w-100">
    <h1 class="category-header text-center" id="category-title">~ Products ~</h1>
    <div class="products container" id="category-products"></div>
</section>

<!--    Main JS-->
<script src="assets/js/.js"></script>

<script src="assets/js/notification.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadCategoryProducts();
    });

    async function loadCategoryProducts() {
        const params = new URLSearchParams(window.location.search);
        const categoryId = params.get('categoryId');
        const categoryName = params.get('categoryName');
        const title = document.getElementById('category-title');
        const productContainer = document.getElementById('category-products');

        if (categoryName) {
            title.textContent = '~ ' + categoryName + ' ~';
        }

        if (!categoryId) {
            productContainer.innerHTML = '<div>No category selected.</div>';
            return;
        }

        productContainer.innerHTML = 'Loading products...';

        try {
            const response = await fetch('api/products/categories/' + categoryId + '/products');
            const data = await response.json();

            if (!data.status) {
                productContainer.innerHTML = '<div>' + (data.message || 'Failed to load products.') + '</div>';
                return;
            }

            title.textContent = '~ ' + (data.categoryName || categoryName || 'Products') + ' ~';

            if (!data.data || data.data.length === 0) {
                productContainer.innerHTML = '<div>No products found.</div>';
                return;
            }

            productContainer.innerHTML = '';
            data.data.forEach(product => productContainer.appendChild(createProductCard(product)));
        } catch (e) {
            productContainer.innerHTML = '<div>Server error. Please try again.</div>';
        }
    }

    function createProductCard(product) {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.onclick = function() {
            window.location.href = 'single-product-view.html?id=' + product.id;
        };
        const imagePath = product.imagePaths && product.imagePaths.length > 0
            ? product.imagePaths[0]
            : 'assets/images/product-01.jpg';
        card.innerHTML =
            '<img src="' + imagePath + '" alt="">' +
            '<h4>' + product.title + '</h4>' +
            '<p class="price">$' + Number(product.price).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</p>';
        return card;
    }
</script>

<!-- Modernizer JS -->
<script src="assets/js/vendor/modernizr.min.js"></script>
<!-- jQuery JS -->
<script src="assets/js/vendor/jquery.js"></script>
<!-- Bootstrap JS -->
<script src="assets/js/vendor/popper.min.js"></script>
<script src="assets/js/vendor/bootstrap.min.js"></script>
<script src="assets/js/vendor/slick.min.js"></script>
<script src="assets/js/vendor/js.cookie.js"></script>
<script src="assets/js/vendor/jquery-ui.min.js"></script>
<script src="assets/js/vendor/jquery.ui.touch-punch.min.js"></script>
<script src="assets/js/vendor/jquery.countdown.min.js"></script>
<script src="assets/js/vendor/sal.js"></script>
<script src="assets/js/vendor/jquery.magnific-popup.min.js"></script>
<script src="assets/js/vendor/imagesloaded.pkgd.min.js"></script>
<script src="assets/js/vendor/isotope.pkgd.min.js"></script>
<script src="assets/js/vendor/counterup.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
