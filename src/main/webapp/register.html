<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | THE FURNITURE STORE</title>
    <link rel="stylesheet" href="assets/css/bootstrap.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png">
</head>
<body>
    <div class="reg-page row row-cols-2" style="width: 100%; height: 100vh;">
        <div class="reg-container col" >
            <div class="brand-label">
                <div class="label-outer col-1">
                    <div class="label-inner col-2">
                    </div>
                </div>
                <div>
                    <h2 class="brand-text">THE FURNITURE STORE</h2>
                </div>
            </div>
            <div class="reg-box ms-3 mt-3">
                <div class="reg-header">
                    <h1>REGISTER</h1>
                </div>
                <fieldset>
                    <div class="field">
                        <label for="fname">First Name</label>
                        <input type="text" id="fname"/>
                    </div>
                    <div class="field">
                        <label for="lname">Last Name</label>
                        <input type="text" id="lname"/>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email"/>
                    </div>
                    <div class="field">
                        <label for="password">password</label>
                        <input type="password" id="password">
                    </div>
                   
                    <div class="buttons register-actions">
                        <button class="login-btn" onclick="register();">REGISTER</button>
                        <button class="backtosignin-btn" onclick="gotoLogin();">Already have an account?</button>
                    </div>
                </fieldset>
            </div>
        </div>
        
        <div class="reg-banner col">
            
        </div>
    </div>

    <!-- JS
============================================ -->
    <!-- Main JS -->
    <script src="assets/js/register.js"></script>
    <!-- Modernizer JS -->
    <script src="assets/js/vendor/modernizr.min.js"></script>
    <!-- jQuery JS -->
    <script src="assets/js/vendor/jquery.js"></script>
    <!-- Bootstrap JS -->
    <script src="assets/js/vendor/popper.min.js"></script>
    <script src="assets/js/vendor/bootstrap.min.js"></script>
    <script src="assets/js/vendor/slick.min.js"></script>
    <script src="assets/js/vendor/js.cookie.js"></script>
    <script src="assets/js/vendor/jquery-ui.min.js"></script>
    <script src="assets/js/vendor/jquery.ui.touch-punch.min.js"></script>
    <script src="assets/js/vendor/jquery.countdown.min.js"></script>
    <script src="assets/js/vendor/sal.js"></script>
    <script src="assets/js/vendor/jquery.magnific-popup.min.js"></script>
    <script src="assets/js/vendor/imagesloaded.pkgd.min.js"></script>
    <script src="assets/js/vendor/isotope.pkgd.min.js"></script>
    <script src="assets/js/vendor/counterup.js"></script>
    <script src="assets/js/vendor/waypoints.min.js"></script>

    <script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
    <script src="assets/js/main.js"></script>
    
</body>
</html>
