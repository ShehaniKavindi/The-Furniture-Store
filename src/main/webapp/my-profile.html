<div class="row">
    <section class="profile-dashboard-section col-md-3">
        <div class="profile-dashboard mt-4 mb-5 ms-4 p-4">
            <h1>The Furniture Store</h1><br>
            <a type="button" class="col-12" href="#">Cart</a><br>
            <a type="button" class="col-12" href="#">Wishlist</a><br>
            <a type="button" class="col-12" href="#">Orders</a><br>
            <a type="button" class="col-12" href="#">Order History</a><br>

            </div>
        </div>
    </section>

    <div class="col">

            <div class="main-profile-details col-11 p-4">

                    <div class="main-profile-picture ms-3" style="width: 7rem;">
                        <img src="product-01.jpg" alt="">

                    <div class="col-6 ms-4">
                        <h2 style="font-weight: 550;">Shehani Kavindi</h2>
                        <p>shehanikavindi2005@gmail.com</p>
                    </div>
                </div>
            </div>
            <div class="address-profile-details col-11 p-4">
                <h2>Profile Details</h2>
                <div class="straight-line"></div><br>
                <div>
                    <div class="row">
                        <div class="col-md-5">
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" class="form-control" value="" id="">
                            </div>
                        </div>
                        <div class="col-md-5">
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" class="form-control" value="" id="">
                            </div>
                        </div>
                        <div class="col-10">
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" class="form-control" value="" id="">
                            </div>
                        </div>
                    </div>
                </div> <br><br>
                <h2>Address Details</h2>
                <div class="straight-line"></div><br>
                <div>
                    <div class="row">
                        <div class="col-10">
                            <div class="form-group">
                                <label>Line 01</label>
                                <input type="text" class="form-control" value="" id="">
                            </div>
                        </div>
                        <div class="col-10">
                            <div class="form-group">
                                <label>Line 02</label>
                                <input type="text" class="form-control" value="" id="">
                            </div>
                        </div>
                        <div class="col-5">
                            <div class="form-group">
                                <label>Postal code</label>
                                <input type="text" class="form-control" value="" id="">
                            </div>
                        </div>
                        <div class="col-5">
                            <div class="form-group">
                                <label>City</label>
                                <input type="text" class="form-control" value="" id="">
                            </div>
                        </div>
                        <div class="col-5">
                            <div class="form-group">
                                <label>District</label>
                                <input type="text" class="form-control" value="" id="">
                            </div>
                        </div>
                        <div class="col-5">
                            <div class="form-group">
                                <label>Province</label>
                                <input type="text" class="form-control" value="" id="">
                            </div>
                        </div>
                    </div>
                    <button class="col-3 update-details-btn">Update Details</button>
                </div>
            </div>
        </section>
    </div>
