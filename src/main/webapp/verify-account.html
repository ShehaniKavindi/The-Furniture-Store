<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account | THE FURNITURE STORE</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png">
    <link rel="stylesheet" href="assets/css/bootstrap.css">
    <style>
        .verify-page {
            display: flex;
            width: 100%;
            height: 100vh;
        }
        .verify-container {
            width: 50%;
            height: 100vh;
            font-family: 'main', serif;
            background-color: white;
        }
        .verify-banner {
            width: 50%;
            height: 100vh;
            background-image: url(assets/images/container-image-01.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
        .verify-box {
            height: 75vh;
            padding: 40px 40px;
            box-shadow: 2px 2px 5px 0px var(--light-grey-brown);
            margin-left: 1.5rem;
            margin-top: 1rem;
        }
        .verify-box h1 {
            margin-top: 2rem;
            font-weight: 300;
            margin-bottom: 1.5rem;
            color: var(--dark-grey-brown);
            font-family: 'main', serif;
        }
        .verify-email-note {
            color: var(--dark-grey-brown);
            font-family: 'sub', sans-serif;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
<div class="verify-page">
    <!-- Left side -->
    <div class="verify-container">
        <div class="brand-label">
            <div class="label-outer col-1">
                <div class="label-inner col-2"></div>
            </div>
            <div>
                <h2 class="brand-text">THE FURNITURE STORE</h2>
            </div>
        </div>

        <div class="verify-box">
            <h1>VERIFY ACCOUNT</h1>

            <p class="verify-email-note">
                A verification code has been sent to <strong id="display-email"></strong>.
                Please check your inbox and enter the 6-digit code below.
            </p>

            <fieldset style="border: none;">
                <div class="field">
                    <label for="verification-code">Code</label>
                    <input type="text" id="verification-code" maxlength="6" placeholder="Enter 6-digit code" style="letter-spacing: 0.3rem; font-size: 1.1rem;"/>
                </div>

                <div class="buttons" style="margin-top: 3rem;">
                    <button class="login-btn" onclick="verifyAccount();">VERIFY</button>
                    <button class="register-btn" onclick="window.location.href='login.html';">BACK TO LOGIN</button>
                </div>
            </fieldset>
        </div>
    </div>

    <!-- Right side banner -->
    <div class="verify-banner"></div>
</div>

<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/vendor/modernizr.min.js"></script>
<script src="assets/js/vendor/jquery.js"></script>
<script src="assets/js/vendor/popper.min.js"></script>
<script src="assets/js/verify-account.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
