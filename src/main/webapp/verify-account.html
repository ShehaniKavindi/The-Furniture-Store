<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account | THE FURNITURE STORE</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png">
    <link rel="stylesheet" href="assets/css/bootstrap.css">
</head>
<body>
<div class="login-page row row-cols-2" style="width: 100%; height: 100vh;">
    <div class="login-container col">
        <div class="brand-label">
            <div class="label-outer col-1">
                <div class="label-inner col-2"></div>
            </div>
            <div>
                <h2 class="brand-text">THE FURNITURE STORE</h2>
            </div>
        </div>

        <div class="login-box">
            <div class="login-header">
                <h1>Verify Account</h1>
            </div>
            <p class="login-subtitle">
                A verification code has been sent to <strong id="display-email"></strong>.
                Check your inbox and enter the 6-digit code below.
            </p>

            <fieldset style="border: none;">
                <div class="field">
                    <label for="verification-code" class="visually-hidden">Code</label>
                    <div class="input-with-icon">
                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="8" width="18" height="12" rx="2"></rect>
                            <path d="M7 8V6a5 5 0 0 1 10 0v2"></path>
                            <circle cx="12" cy="14" r="1.5"></circle>
                        </svg>
                        <input type="text" id="verification-code" maxlength="6" placeholder="Enter 6-digit code" style="letter-spacing: 0.3rem; font-size: 1.1rem;"/>
                    </div>
                </div>

                <div class="buttons">
                    <button class="login-btn" onclick="verifyAccount();">Verify</button>
                    <button class="register-btn" onclick="window.location.href='login.html';">Back to Login</button>
                </div>
            </fieldset>
        </div>
    </div>

    <div class="login-banner col"></div>
</div>

<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/vendor/modernizr.min.js"></script>
<script src="assets/js/vendor/jquery.js"></script>
<script src="assets/js/vendor/popper.min.js"></script>
<script src="assets/js/verify-account.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
